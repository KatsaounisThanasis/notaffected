[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notaffected"
dynamic = ["version"]
description = "Deterministically prove whether a CVE actually affects your Linux hosts and emit OpenVEX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanos Katsaounis" }]
keywords = [
    "security", "cve", "vex", "openvex", "vulnerability-management",
    "reachability", "linux", "sre", "devsecops", "trivy", "grype",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
notaffected = "notaffected.cli:main"

[tool.hatch.version]
path = "notaffected/__init__.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
