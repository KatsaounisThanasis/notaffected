[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notaffected"
dynamic = ["version"]
description = "Deterministically prove whether CVEs actually affect Linux & Windows Server hosts and emit OpenVEX v0.2.0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanos Katsaounis" }]
keywords = [
    "security", "cve", "vex", "openvex", "vulnerability-management",
    "reachability", "linux", "sre", "devsecops", "trivy", "grype",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/KatsaounisThanasis/notaffected"
Repository = "https://github.com/KatsaounisThanasis/notaffected"
Issues = "https://github.com/KatsaounisThanasis/notaffected/issues"

[project.scripts]
notaffected = "notaffected.cli:main"

[tool.hatch.version]
path = "notaffected/__init__.py"

[tool.pytest.ini_options]
markers = ["live: runs real probes on this machine, skipped by default (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "jsonschema>=4.0",
]
