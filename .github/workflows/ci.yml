name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest suite
        run: pytest -q

      - name: Smoke test CLI demo & OpenVEX export
        run: |
          notaffected scan --demo-fleet --offline --emit-vex /tmp/demo.vex.json --json /tmp/demo.json --html /tmp/demo.html
          test -s /tmp/demo.html
          python - <<'EOF'
          import collections
          import json

          import jsonschema

          report = json.load(open("/tmp/demo.json"))
          counts = dict(collections.Counter(v["status"] for v in report["verdicts"]))
          print(counts)
          # 5 demo hosts x 7 built-in CVEs; a change here must be explained, not just updated.
          assert counts == {"not_affected": 31, "affected": 4}, counts
          vex = json.load(open("/tmp/demo.vex.json"))
          assert len(vex["statements"]) == 35, len(vex["statements"])
          jsonschema.validate(vex, json.load(open("fixtures/openvex_json_schema.json")))
          print("OpenVEX document is valid against the official v0.2.0 schema")
          EOF
