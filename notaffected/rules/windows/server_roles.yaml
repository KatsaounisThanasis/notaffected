# Bundled Windows Server Curated Rules (verified against Microsoft Security Update Guide / Server 2022 20348.xxxx)
rules:
  - cve_id: CVE-2024-38077
    summary: "Windows Remote Desktop Licensing Service ('MadLicense') pre-auth 0-click remote code execution"
    severity: CRITICAL
    os_family: windows
    confidence: high
    preconditions:
      - probe: windows_build_vulnerable
        params:
          kb: KB5040437
          fixed_build: "20348.2582"
        description: "Windows Server build predates July 2024 patch (KB5040437 / build 20348.2582)"
        justification_if_not_met: vulnerable_code_not_present
      - probe: windows_service_active
        params:
          service: TermServLicensing
        description: "Remote Desktop Licensing Service ('TermServLicensing') is running"
        justification_if_not_met: vulnerable_code_not_in_execute_path
    mitigation:
      - "Stop-Service -Name TermServLicensing -Force; Set-Service -Name TermServLicensing -StartupType Disabled"
      - "Install July 2024 Cumulative Update (KB5040437 or later)"
    patch:
      status: released
      fixed_version: "KB5040437 (OS Build 20348.2582)"
      advisory_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2024-38077"

